# Автопроверка при каждом push и pull request: тесты backend на обеих БД и сборка frontend.
# Зелёная галочка на GitHub = «проект доказывает работоспособность» (требование 13).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Зависимости
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Тесты (встроенный PostgreSQL или SQLite)
        run: python -m pytest -v
        working-directory: backend
        env:
          VAC_DB: ${{ matrix.db == 'sqlite' && 'sqlite' || '' }}

  frontend:
    name: frontend (типы и сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
