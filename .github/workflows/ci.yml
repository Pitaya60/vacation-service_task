# Автопроверка при каждом push и pull request: тесты backend на обеих БД и сборка frontend.
# Зелёная галочка на GitHub = «проект доказывает работоспособность» (требование 13).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Зависимости
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Тесты (встроенный PostgreSQL или SQLite)
        run: python -m pytest -v
        working-directory: backend
        env:
          VAC_DB: ${{ matrix.db == 'sqlite' && 'sqlite' || '' }}

  frontend:
    name: frontend (типы и сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: интерфейс (Chromium, Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        run: |
          pip install -r backend/requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
          (cd frontend && npm ci && npm run build)
      - name: Запуск backend (SQLite во временной папке) и frontend (vite preview)
        run: |
          (cd backend && VAC_DB=sqlite VAC_SQLITE="$RUNNER_TEMP/e2e.sqlite3" nohup python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &)
          (cd frontend && nohup npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health >/dev/null && curl -sf -o /dev/null http://localhost:4173; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP"/*.log; exit 1
      - name: Сквозные тесты
        run: python -m pytest e2e -v
        env:
          E2E_SHOTS: ${{ runner.temp }}/shots
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
