services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: pg, POSTGRES_DB: vac}
    volumes: ["./db:/docker-entrypoint-initdb.d"]
    ports: ["5432:5432"]
  backend:
    image: node:20
    working_dir: /app
    volumes: ["./backend:/app"]
    environment: {DATABASE_URL: "postgres://postgres:pg@db:5432/vac", REMIND_DAYS: "3"}
    command: sh -c "npm i && npx tsx src/server.ts"
    ports: ["3001:3001"]
    depends_on: [db]
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm i && npx vite --host"
    ports: ["5173:5173"]
